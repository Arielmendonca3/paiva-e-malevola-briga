<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <main>
    <!-- Seção do Vídeo em Destaque -->

          <p>Confira as imagens da confusão e os desdobramentos completos</p>

    <section class="faq-section">

      <div id="faq-container">
        <!-- O script.js vai inserir as 50 perguntas aqui -->
      </div>
    </section>

  <footer>
    <p>&copy; Portal de Notícias e Polêmicas dos Famosos</p>
  </footer>

  <script src="script.js"></script>
